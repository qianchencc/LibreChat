services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    command: server /data --address 127.0.0.1:19010 --console-address 127.0.0.1:19011
    network_mode: host
    environment:
      MINIO_ROOT_USER: librechat-test
      MINIO_ROOT_PASSWORD: librechat-test-secret
    volumes:
      - minio-data:/data

volumes:
  minio-data:
