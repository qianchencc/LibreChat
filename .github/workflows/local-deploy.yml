name: Build and deploy LibreChat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: librechat-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.repository == 'qianchencc/LibreChat'
    runs-on: [self-hosted, linux, x64, librechat-build]
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build production image
        env:
          IMAGE: librechat-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx inspect librechat-builder --bootstrap
          docker buildx build \
            --builder librechat-builder \
            --load \
            --network host \
            --build-arg HTTP_PROXY=http://127.0.0.1:17890 \
            --build-arg HTTPS_PROXY=http://127.0.0.1:17890 \
            --build-arg NO_PROXY=localhost,127.0.0.1,::1 \
            --build-arg BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}" \
            .

      - name: Transfer and deploy over LAN
        env:
          IMAGE: librechat-ci:${{ github.sha }}
          PROD_HOST: admin@10.5.12.112
          PROD_PORT: 40022
          SSH_KEY: /home/lab/.ssh/librechat_prod_ed25519
          DEPLOY_DIR: /vol2/1000/Plugins/librechat
          REMOTE_CONFIG: /tmp/librechat-${{ github.sha }}.yaml
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -p "${PROD_PORT}" -i "${SSH_KEY}")
          scp_args=(-o BatchMode=yes -P "${PROD_PORT}" -i "${SSH_KEY}")
          docker save "${IMAGE}" \
            | zstd -T0 -3 -q \
            | ssh "${ssh_args[@]}" "${PROD_HOST}" 'zstd -dc | docker load'
          scp "${scp_args[@]}" librechat.yaml "${PROD_HOST}:${REMOTE_CONFIG}"
          ssh "${ssh_args[@]}" "${PROD_HOST}" \
            "IMAGE='${IMAGE}' DEPLOY_DIR='${DEPLOY_DIR}' CONFIG='${REMOTE_CONFIG}' bash -s" \
            < deploy/deploy.sh
