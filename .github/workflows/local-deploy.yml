name: Build and deploy LibreChat

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: librechat-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qianchencc/LibreChat'
    runs-on: [self-hosted, linux, x64, librechat-build]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build production image
        env:
          IMAGE: librechat-ci:${{ github.sha }}
          ARTIFACT: /home/lab/librechat-artifacts/librechat-${{ github.sha }}.tar.zst
        run: |
          docker logout ghcr.io || true
          docker buildx inspect librechat-builder --bootstrap
          docker buildx build \
            --builder librechat-builder \
            --load \
            --network host \
            --build-arg HTTP_PROXY=http://127.0.0.1:17890 \
            --build-arg HTTPS_PROXY=http://127.0.0.1:17890 \
            --build-arg NO_PROXY=localhost,127.0.0.1,::1 \
            --build-arg BUILD_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}" \
            .
          mkdir -p "$(dirname "${ARTIFACT}")"
          docker save "${IMAGE}" | zstd -T0 -3 -q -f -o "${ARTIFACT}.tmp"
          mv "${ARTIFACT}.tmp" "${ARTIFACT}"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, librechat-prod]
    timeout-minutes: 10

    steps:
      - name: Check out deployment config
        uses: actions/checkout@v5

      - name: Deploy and verify
        env:
          IMAGE: librechat-ci:${{ github.sha }}
          ARTIFACT: /home/lab/librechat-artifacts/librechat-${{ github.sha }}.tar.zst
          DEPLOY_DIR: /vol2/1000/Plugins/librechat
          LAB_HOST: lab@10.15.11.185
          SSH_KEY: /home/admin/.ssh/librechat_lab_proxy_ed25519
        run: |
          set -eu
          cleanup() {
            ssh -o BatchMode=yes -i "${SSH_KEY}" "${LAB_HOST}" "rm -f '${ARTIFACT}'" || true
          }
          trap cleanup EXIT

          previous_image="$(docker inspect LibreChat --format '{{.Image}}')"
          ssh -o BatchMode=yes -i "${SSH_KEY}" "${LAB_HOST}" "cat '${ARTIFACT}'" \
            | zstd -dc \
            | docker load
          docker tag "${IMAGE}" librechat-local:latest
          install -m 0644 librechat.yaml "${DEPLOY_DIR}/librechat.yaml"
          cd "${DEPLOY_DIR}"
          docker compose up -d --no-deps api

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3080/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "${healthy}" = true ]; then
            docker compose ps api
            exit 0
          fi

          docker compose logs --tail=100 api
          docker tag "${previous_image}" librechat-local:latest
          docker compose up -d --no-deps api
          exit 1
